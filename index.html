<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALICE — Ice Age & Alliances Generator</title><style>
:root{--ice:#bceeff;--silver:#e7f6ff;--muted:#a5c7d8;--deep:#071b31}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#386581 0%,#0b2946 40%,#03101f 100%);color:#e9f7ff;font:15px Georgia,serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.20;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#b6e9ff 1px,transparent 1px);background-size:81px 91px,127px 139px;background-position:15px 8px,49px 68px}.wrap{position:relative;max-width:1220px;margin:18px auto;padding:20px 28px 65px;border:7px ridge #c0e7f3;box-shadow:inset 0 0 0 2px #4d9bbb,0 0 0 8px #061628,0 12px 45px #0009;background:linear-gradient(145deg,#0c3048e8,#081b35f2 75%)}header{text-align:center;padding:0 0 13px;border-bottom:2px solid #a9dbe7}.brand-logo{display:block;width:min(330px,72vw);height:auto;margin:0 auto;border-radius:50%;filter:drop-shadow(0 0 22px #8bdcff50)}.brand-title{font-size:28px;letter-spacing:.25em;font-weight:bold;color:#d4f5ff;text-shadow:0 2px 8px #6eb5e7}.brand-sub{font-size:12px;letter-spacing:.16em;color:#b5d6e9;margin-top:5px}.product-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:960px;gap:16px;margin:26px auto 25px}.product-btn{border:2px solid #b4e2ef;border-radius:16px;background:linear-gradient(#224b6b,#0c2743);padding:8px 6px 8px;cursor:pointer;color:#f2fbff;font-family:Georgia,serif;box-shadow:inset 0 1px 0 #fff6,0 8px 20px #0008;transition:transform .18s,box-shadow .18s}.product-btn:hover{transform:translateY(-5px);box-shadow:0 0 22px #80dcff66}.product-btn:focus-visible{outline:3px solid #fff;outline-offset:4px}.pack-icon{height:190px;display:flex;align-items:center;justify-content:center}.pack-icon img{max-width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 7px #0008)}.product-label{display:none;margin-top:9px;line-height:1.25;font-size:16px;font-weight:bold;letter-spacing:.03em}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.btn{border:1px solid #92c9dd;border-radius:7px;padding:11px 16px;background:#1c4563;color:#effbff;cursor:pointer;font-weight:bold;font-family:Georgia,serif}.btn:disabled{opacity:.5;cursor:not-allowed}.btn:hover{filter:brightness(1.2)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:18px}.stat{background:#143a57;border:1px solid #70a9c2;border-radius:8px;padding:13px}.stat b{display:block;font-size:24px;color:#d1f5ff}.stat small{color:#b5d6e9;font-family:system-ui,sans-serif}.note{background:#17415d;border-left:3px solid #c2f1ff;padding:12px 15px;border-radius:4px;color:#d6f3ff;margin-bottom:18px;font-family:system-ui,sans-serif}.note:empty{display:none}.section{margin-top:28px}.section h2{font-size:23px;border-bottom:1px solid #77b5d0;padding-bottom:9px;color:#c6f1ff}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:13px}.card{background:#153750;border:1px solid #6b9cb6;border-radius:10px;padding:8px;cursor:pointer;text-align:left;color:inherit}.card:hover{border-color:#e2f9ff}.art{aspect-ratio:488/680;border-radius:7px;background:#365f79;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;overflow:hidden}.art img{width:100%;height:100%;object-fit:contain}.placeholder{font-weight:bold;font-size:17px}.card .name{font-weight:bold;margin-top:8px;line-height:1.3;font-size:13px}.card .meta{color:#b3d4e5;font-size:11px;margin-top:3px}.landgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}.land{background:#244b66;padding:9px;border-radius:8px;text-align:center}.land b{display:block;color:#c6f1ff;font-size:24px}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{background:#12314b;padding:20px;border:2px solid #b5e9ff;border-radius:12px;max-width:450px;width:100%;text-align:center}.modalbox img{max-width:100%;max-height:68vh}#print-title{display:none}@media(max-width:700px){.wrap{margin:8px;padding:16px 12px 35px;border-width:4px}.product-buttons{gap:8px}.product-btn{padding:6px 3px}.pack-icon{height:75px}.product-label{font-size:12px}.brand-title{font-size:22px}.cards{grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}}@media(max-width:460px){.product-buttons{grid-template-columns:1fr;max-width:230px}.pack-icon{height:95px}.product-label{font-size:15px}}@media print{body,.wrap{background:#fff!important;color:#000!important;border:0;box-shadow:none;outline:0}.wrap{padding:0;margin:0;max-width:none}body:before,header,.toolbar,.product-buttons,.note,.stats{display:none!important}#print-title{display:block!important;color:#111!important;text-align:center;font-size:24px;margin:0 0 16px;border-bottom:1px solid #777;padding:0 0 12px}.card,.land{background:#fff;color:#000;border-color:#aaa}.card .meta{color:#555}.art{background:#eee}.cards{grid-template-columns:repeat(6,1fr);gap:8px}.section{break-inside:auto;page-break-inside:auto}.card,.art,.landgrid>div{break-inside:avoid;page-break-inside:avoid}.art img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;print-color-adjust:exact;-webkit-print-color-adjust:exact}.card{padding:5px}.section h2{color:#111;border-color:#aaa}}
</style></head><body><div class="wrap"><header><img class="brand-logo" src="assets/alice-logo.png" alt="ALICE format logo"></header><div class="product-buttons"><button class="product-btn" id="generate" aria-label="Generate Ice Age Starter Deck"><span class="pack-icon"><img src="assets/ice-starter.png" alt="Ice Age starter deck illustration"></span><span class="product-label">GENERATE<br>ICE AGE<br>STARTER DECK</span></button><button class="product-btn" id="boosterice" aria-label="Generate Ice Age Booster Pack"><span class="pack-icon"><img src="assets/ice-booster.png" alt="Ice Age booster pack illustration"></span><span class="product-label">GENERATE<br>ICE AGE<br>BOOSTER PACK</span></button><button class="product-btn" id="boosterall" aria-label="Generate Alliances Booster Pack"><span class="pack-icon"><img src="assets/all-booster.png" alt="Alliances booster pack illustration"></span><span class="product-label">GENERATE<br>ALLIANCES<br>BOOSTER PACK</span></button></div><div class="toolbar tools" style="display:none"><button class="btn" id="copy">Copy Card List</button><button class="btn" id="printCards">Print Cards</button><button class="btn" id="refresh">Refresh Card Databases</button></div><div class="stats" id="stats" style="display:none"></div><div class="note" id="notice" aria-live="polite">Loading Ice Age and Alliances card databases…</div><h2 id="print-title"></h2><div id="output"></div></div><div class="modal" id="modal"><div class="modalbox"><button class="btn" id="close" style="float:right">Close ×</button><h3 id="modalname"></h3><div id="modalimage"></div><p id="modalmeta"></p></div></div><script>
'use strict';

const landNames=['Plains','Island','Swamp','Mountain','Forest'];
const state={sets:{},current:null,loading:false};
const $=id=>document.getElementById(id);
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rnd(n){if(n<=0)throw Error('Empty card pool');if(typeof crypto!=='undefined'&&crypto.getRandomValues){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}return Math.floor(Math.random()*n)}
function sample(a,n){if(a.length<n)throw Error('Not enough cards in this rarity: need '+n+', found '+a.length);a=a.slice();for(let i=0;i<n;i++){let j=i+rnd(a.length-i);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function showCard(c){$('modalname').textContent=c.name;$('modalmeta').textContent=(c.set==='all'?'Alliances':'Ice Age')+' · '+c.rarity;$('modalimage').innerHTML=c.image?'<img src="'+safe(c.image)+'" alt="'+safe(c.name)+'">':'<p>Image unavailable</p>';$('modal').classList.add('show')}
function tile(c,label){return '<button class="card" data-id="'+safe(c.id)+'"><div class="art">'+(c.image?'<img loading="eager" src="'+safe(c.image)+'" alt="'+safe(c.name)+'">':'<span class="placeholder">'+safe(c.name)+'</span>')+'</div><div class="name">'+safe(c.name)+'</div><div class="meta">'+safe(label)+'</div></button>'}
const titles={starter:'Ice Age Starter Deck',ice:'Ice Age Booster Pack',all:'Alliances Booster Pack'};
function render(){const d=state.current;if(!d)return;$('print-title').textContent=titles[d.kind];let out='';const all=[];for(const g of d.groups){out+='<section class="section"><h2>'+safe(g.label)+' · '+g.cards.length+'</h2><div class="cards">';for(const c of g.cards){out+=tile(c,c.set==='all'?'Alliances · '+c.rarity:'Ice Age · '+c.rarity);all.push(c)}out+='</div></section>'}if(d.lands){out+='<section class="section"><h2>Basic Lands · 22</h2><div class="landgrid">';for(const {card,qty} of d.lands){out+='<div><div class="land"><b>'+qty+'</b> copies</div>'+tile(card,'Ice Age · '+qty+' copies')+'</div>';all.push(card)}out+='</div></section>'}$('output').innerHTML=out;const lookup=new Map(all.map(c=>[c.id,c]));document.querySelectorAll('.card[data-id]').forEach(el=>el.onclick=()=>showCard(lookup.get(el.dataset.id)));document.querySelector('.toolbar').style.display='flex';$('stats').style.display='grid';$('stats').innerHTML=d.stats.map(([n,t])=>'<div class="stat"><b>'+safe(n)+'</b><small>'+safe(t)+'</small></div>').join('');$('notice').textContent='';$('notice').style.display='none'}
async function printCards(){
 const button=$('printCards');button.disabled=true;
 const previous=button.textContent;button.textContent='Preparing card images…';
 try{
  const imgs=[...document.querySelectorAll('#output .art img')];
  await Promise.all(imgs.map(img=>new Promise(resolve=>{
   img.loading='eager';img.decoding='sync';
   if(img.complete){resolve();return;}
   let finished=false;
   const done=()=>{if(!finished){finished=true;resolve();}};
   img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});
   setTimeout(done,12000);
  })));
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  window.print();
 }finally{button.disabled=false;button.textContent=previous;}
}
$('printCards').addEventListener('click',printCards);

function choose(set,rarity,n,used){let a=state.sets[set].pools[rarity].filter(c=>!used.has(c.name.toLowerCase()));let picked=sample(a,n);picked.forEach(c=>used.add(c.name.toLowerCase()));return picked}
function make(kind){try{const set=kind==='all'?'all':'ice';if(!state.sets[set])throw Error(set.toUpperCase()+' database is not ready. Check your connection and refresh.');let used=new Set(),groups=[],lands=null,stats=[];
if(kind==='starter'){for(const [r,n,label] of [['rare',3,'Rares'],['uncommon',9,'Uncommons'],['common',26,'Commons']])groups.push({label,cards:choose('ice',r,n,used)});
// Historical Ice Age basic land sheet: each normal land 3/20, each snow land 1/20.
// Keep the previously agreed guarantee of at least 3 of each land TYPE.
let counts=Object.fromEntries(landNames.map(n=>[n,3]));for(let i=0;i<7;i++)counts[landNames[rnd(5)]]++;
lands=[];for(const name of landNames){let snow=0;for(let i=0;i<counts[name];i++)if(rnd(4)===0)snow++;for(const [land,qty] of [[name,counts[name]-snow],['Snow-Covered '+name,snow]])if(qty)lands.push({card:state.sets.ice.lands[land],qty})}
stats=[['60','Total cards'],['3','Rares'],['9','Uncommons'],['26','Commons'],['22','Basic lands']];}
else if(kind==='ice'){for(const [r,n,label] of [['rare',1,'Rare'],['uncommon',3,'Uncommons'],['common',11,'Commons']])groups.push({label,cards:choose('ice',r,n,used)});stats=[['15','Total cards'],['1','Rare'],['3','Uncommons'],['11','Commons']];}
else{ // Historical Alliances: 8 common-sheet, 3 uncommon-sheet, 1 rare-sheet slots.
// Scryfall rarity is a proxy for sheet position, so this is a 1/3/8 approximation, not exact print-run odds.
for(const [r,n,label] of [['rare',1,'Rare-sheet slot (approx.)'],['uncommon',3,'Uncommon-sheet slots (approx.)'],['common',8,'Common-sheet slots (approx.)']])groups.push({label,cards:choose('all',r,n,used)});stats=[['12','Total cards'],['1','Rare-sheet slot'],['3','Uncommon-sheet slots'],['8','Common-sheet slots']];}
state.current={kind,groups,lands,stats};render();}catch(e){$('notice').style.display='block';$('notice').textContent='Could not generate: '+e.message}}
function textDeck(){let d=state.current;if(!d)return '';let a=['ALICE — '+titles[d.kind],''];for(const g of d.groups){a.push(g.label.toUpperCase());for(const c of g.cards)a.push('1 '+c.name);a.push('')}if(d.lands){a.push('BASIC LANDS');for(const {card,qty} of d.lands)a.push(qty+' '+card.name)}return a.join('\n')}
async function fetchSet(set,force){const key='alice_printings_v1_'+set;let cards=null;if(!force){try{const cache=JSON.parse(localStorage.getItem(key)||'null');if(cache&&Date.now()-cache.saved<7*86400000&&Array.isArray(cache.cards))cards=cache.cards}catch(e){}}
if(!cards){cards=[];let url='https://api.scryfall.com/cards/search?q='+encodeURIComponent('set:'+set)+'&unique=prints';let pages=0;while(url){if(++pages>30)throw Error('Too many Scryfall pages');const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('Scryfall HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.data))throw Error('Invalid Scryfall response');cards.push(...j.data);url=j.has_more?j.next_page:null;$('notice').style.display='block';$('notice').textContent='Downloading '+set.toUpperCase()+': '+cards.length+' card printings…'}try{localStorage.setItem(key,JSON.stringify({saved:Date.now(),cards}))}catch(e){}}
let byName=new Map(),lands={};for(const c of cards){if(c.set!==set||c.digital||(c.games&&!c.games.includes('paper')))continue;const name=String(c.name||'').trim();if(!name)continue;const item={id:c.id,name,set,rarity:c.rarity,image:c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||null};if(set==='ice'&&(landNames.includes(name)||landNames.some(n=>name==='Snow-Covered '+n))){if(!lands[name]||!lands[name].image)lands[name]=item;continue}if(c.type_line?.includes('Basic Land')||!['rare','uncommon','common'].includes(c.rarity))continue;if(!byName.has(name.toLowerCase()))byName.set(name.toLowerCase(),item)}let pools={rare:[],uncommon:[],common:[]};for(const c of byName.values())pools[c.rarity].push(c);
if(set==='ice'){for(const name of [...landNames,...landNames.map(n=>'Snow-Covered '+n)])if(!lands[name])throw Error('Missing '+name+' printing in Ice Age');for(const [r,n] of [['rare',3],['uncommon',9],['common',26]])if(pools[r].length<n)throw Error('Insufficient '+r+' Ice Age cards')}else{for(const [r,n] of [['rare',1],['uncommon',3],['common',8]])if(pools[r].length<n)throw Error('Insufficient '+r+' Alliances cards')}
return {pools,lands,count:byName.size}}
async function load(force=false){if(state.loading)return;state.loading=true;$('refresh').disabled=true;let errors=[];for(const set of ['ice','all']){try{state.sets[set]=await fetchSet(set,force)}catch(e){delete state.sets[set];errors.push(set.toUpperCase()+': '+e.message)}}state.loading=false;$('refresh').disabled=false;$('notice').style.display=errors.length?'block':'none';$('notice').textContent=errors.length?'Database issue: '+errors.join(' | '):''}
$('generate').onclick=()=>make('starter');$('boosterice').onclick=()=>make('ice');$('boosterall').onclick=()=>make('all');$('refresh').onclick=()=>load(true);$('copy').onclick=async()=>{const s=textDeck();if(!s)return;try{await navigator.clipboard.writeText(s);alert('Card list copied')}catch(e){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('Card list copied')}};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};load();
</script></body></html>
